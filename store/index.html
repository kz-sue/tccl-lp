<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TaskChute Cloud Lite をダウンロード</title>
<link rel="icon" href="/assets/icon.png" type="image/png">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    text-align: center; line-height: 1.6; padding: 24px; box-sizing: border-box;
  }
  .wrap { max-width: 360px; }
  .app-icon {
    width: 72px; height: 72px; border-radius: 16px; display: block; margin: 0 auto 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; margin: 0 0 24px; opacity: .75; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .links a {
    display: block; padding: 12px 16px; border-radius: 10px; text-decoration: none;
    border: 1px solid currentColor; color: inherit; font-size: 15px;
  }
</style>
</head>
<body>
<div class="wrap">
  <img class="app-icon" src="/assets/icon.png" alt="" width="72" height="72">
  <h1>TaskChute Cloud Lite</h1>
  <p id="msg">ストアに移動しています…</p>
  <!-- JavaScriptが動かない場合・自動で移動しない場合の予備リンク -->
  <div class="links">
    <a id="link-ios" href="https://apps.apple.com/jp/app/id6806254121">App Store で開く</a>
    <a id="link-android" href="https://play.google.com/store/apps/details?id=jp.zoelab.taskchutecloudlite">Google Play で開く</a>
  </div>
</div>

<script>
(function () {
  // ===== 設定（ここだけ編集） ==========================================
  var CONFIG = {
    appleId: "6806254121",
    androidPackage: "jp.zoelab.taskchutecloudlite",

    // App Store Connect のキャンペーンリンク用 provider token（pt）。
    // App Store Connect > App Analytics > 「キャンペーン」でリンクを生成すると URL 内に pt=XXXX が出ます。
    // 空のままでも転送はできますが、App Analytics のキャンペーン別集計には出ません。
    appleProviderToken: "",

    // GA4 の測定ID（例: "G-XXXXXXXXXX"）。空なら計測なしで即転送。
    ga4MeasurementId: "G-4ZSHEN2KXC",

    // PC など判別できない端末の戻り先（LPのダウンロード欄）
    fallbackUrl: "https://tccl.zoelab.jp/#download",

    // 流入元の既定値（URLに ?src=xxx があればそちらを優先）
    defaultSource: "qr",
    campaign: "launch"
  };
  // ====================================================================

  // 流入元を取得（Apple の ct は40文字まで。英数字・_・- のみに整形）
  var params = new URLSearchParams(location.search);
  var src = (params.get("src") || CONFIG.defaultSource)
    .toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 40) || CONFIG.defaultSource;

  // 端末判定（iPadOS 13以降は「Mac」を名乗るため、タッチ対応で判別）
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
              (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var platform = isAndroid ? "android" : isIOS ? "ios" : "other";

  // App Store（キャンペーンリンク形式）
  var iosUrl = "https://apps.apple.com/jp/app/id" + CONFIG.appleId +
    "?ct=" + encodeURIComponent(src) + "&mt=8" +
    (CONFIG.appleProviderToken ? "&pt=" + encodeURIComponent(CONFIG.appleProviderToken) : "");

  // Google Play（referrer に UTM を入れる。値全体を1回エンコード）
  var referrer = "utm_source=lp&utm_medium=" + src + "&utm_campaign=" + CONFIG.campaign;
  var androidUrl = "https://play.google.com/store/apps/details?id=" + CONFIG.androidPackage +
    "&referrer=" + encodeURIComponent(referrer);

  // 予備リンクにも同じパラメータを反映
  document.getElementById("link-ios").href = iosUrl;
  document.getElementById("link-android").href = androidUrl;

  var target = platform === "ios" ? iosUrl :
               platform === "android" ? androidUrl :
               CONFIG.fallbackUrl;

  if (platform === "other") {
    document.getElementById("msg").textContent = "スマートフォンでQRコードを読み取るか、下のボタンからストアを開いてください。";
  }

  // 転送（二重実行防止つき）
  var done = false;
  function go() {
    if (done) return;
    done = true;
    location.replace(target);
  }

  // GA4 計測 → 送信完了 or 600ms で転送
  if (CONFIG.ga4MeasurementId) {
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", CONFIG.ga4MeasurementId, { send_page_view: false });
    gtag("event", "store_redirect", {
      platform: platform,
      source: src,
      transport_type: "beacon",
      event_callback: go
    });
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id=" + CONFIG.ga4MeasurementId;
    document.head.appendChild(s);
    setTimeout(go, 600);
  } else {
    go();
  }
})();
</script>
</body>
</html>
